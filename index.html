<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>上传发票</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #e8f4fd; min-height: 100vh; }
    .header { background: linear-gradient(135deg, #1a9fd4, #0d7fb5); padding: 1.2rem 2rem; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(13,127,181,0.3); }
    .header-logo { width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .header h1 { font-size: 17px; font-weight: 700; color: #fff; }
    .header p { font-size: 13px; color: rgba(255,255,255,0.85); }
    .container { max-width: 540px; margin: 2rem auto; padding: 0 1rem 2rem; }
    .card { background: #fff; border: none; border-radius: 14px; padding: 1.5rem; margin-bottom: 1rem; box-shadow: 0 2px 12px rgba(13,127,181,0.1); }
    .section-title { font-size: 12px; font-weight: 700; color: #1a9fd4; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 1rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 14px; color: #555; margin-bottom: 6px; font-weight: 500; }
    .field input[type="text"] { width: 100%; padding: 10px 14px; border: 1.5px solid #b8dff0; border-radius: 8px; font-size: 14px; color: #111; outline: none; transition: border-color 0.15s; background: #f5fbff; }
    .field input[type="text"]:focus { border-color: #1a9fd4; background: #fff; }
    .drop-zone { border: 2px dashed #7dc8e8; border-radius: 12px; padding: 2rem; text-align: center; cursor: pointer; transition: all 0.15s; background: #f0f9ff; margin-bottom: 1rem; }
    .drop-zone:hover, .drop-zone.drag-over { border-color: #1a9fd4; background: #daf0fc; }
    .drop-zone .icon { font-size: 36px; display: block; margin-bottom: 8px; }
    .drop-zone p { font-size: 14px; color: #1a9fd4; font-weight: 500; margin-bottom: 4px; }
    .drop-zone span { font-size: 12px; color: #7dc8e8; }
    .preview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1rem; }
    .preview-item { position: relative; border-radius: 8px; overflow: hidden; border: 1.5px solid #b8dff0; aspect-ratio: 1; }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .preview-item .remove { position: absolute; top: 4px; right: 4px; background: rgba(255,255,255,0.95); border: none; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; color: #555; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
    .preview-count { font-size: 13px; color: #1a9fd4; margin-bottom: 8px; font-weight: 500; }
    .btn-upload { width: 100%; padding: 14px; background: linear-gradient(135deg, #1a9fd4, #0d7fb5); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity 0.15s, transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 3px 10px rgba(13,127,181,0.35); }
    .btn-upload:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-upload:active { transform: translateY(0); }
    .btn-upload:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
    .status-box { display: none; padding: 12px 16px; border-radius: 10px; font-size: 14px; align-items: flex-start; gap: 10px; margin-top: 1rem; }
    .status-box.loading { display: flex; background: #e8f4fd; color: #1a9fd4; border: 1.5px solid #7dc8e8; }
    .status-box.success { display: flex; background: #e8f8f0; color: #1a8a4a; border: 1.5px solid #7dd4a8; }
    .status-box.error { display: flex; background: #fff0f0; color: #c62828; border: 1.5px solid #f5a0a0; }
    .status-box.warning { display: flex; background: #fff8f0; color: #b07800; border: 1.5px solid #f5c070; }
    .spinner { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; border: 2px solid #b8dff0; border-top-color: #1a9fd4; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-wrap { margin-top: 8px; }
    .progress-bar-bg { background: #d0eaf7; border-radius: 99px; height: 6px; overflow: hidden; }
    .progress-bar { background: linear-gradient(90deg, #1a9fd4, #0d7fb5); height: 100%; border-radius: 99px; transition: width 0.3s; }
    .progress-text { font-size: 12px; color: #1a9fd4; margin-top: 4px; text-align: right; }
    .history-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .btn-clear { font-size: 12px; color: #aaa; background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
    .btn-clear:hover { background: #f0f0f0; color: #c62828; }
    .history-empty { font-size: 13px; color: #aaa; text-align: center; padding: 1rem 0; }
    .h-record { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f0f5fa; }
    .h-record:last-child { border-bottom: none; }
    .h-icon { width: 36px; height: 36px; border-radius: 8px; background: #e8f4fd; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .h-info { flex: 1; }
    .h-name { font-size: 14px; font-weight: 600; color: #111; margin-bottom: 2px; }
    .h-date { font-size: 12px; color: #888; }
    .h-count { background: #e8f4fd; color: #1a9fd4; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; flex-shrink: 0; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-logo">🧾</div>
  <div>
    <h1>发票上传系统</h1>
    <p>照片上传后将自动保存</p>
  </div>
</div>

<div class="container">
  <div class="card">
    <p class="section-title">客户信息</p>
    <div class="field">
      <label>微信名</label>
      <input type="text" id="customerName" placeholder="请输入微信名" />
    </div>
  </div>

  <div class="card">
    <p class="section-title">发票照片</p>
    <div class="drop-zone" id="dropZone">
      <span class="icon">📤</span>
      <p>点击选择照片或拖拽至此处</p>
      <span>支持 JPG、PNG、HEIC，可同时选择多张</span>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none" />
    </div>
    <div id="previewCount" class="preview-count" style="display:none"></div>
    <div class="preview-grid" id="previewGrid"></div>
    <button class="btn-upload" id="uploadBtn" disabled>☁️ 上传</button>
    <div class="status-box" id="statusBox">
      <div class="spinner" id="spinner" style="display:none"></div>
      <div style="flex:1">
        <span id="statusText"></span>
        <div class="progress-wrap" id="progressWrap" style="display:none">
          <div class="progress-bar-bg"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
          <div class="progress-text" id="progressText">0 / 0</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="history-header">
      <p class="section-title" style="margin-bottom:0">上传记录</p>
      <button class="btn-clear" id="clearBtn">清空记录</button>
    </div>
    <div id="historyList"><p class="history-empty">暂无上传记录</p></div>
  </div>
</div>

<script>
var POWER_AUTOMATE_URL = "https://default4dc4b497ff1f4fff857bfa0d86f15a.72.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/cf97a6044d424595b762b220cd87a7e7/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=yioV9Os8w__fkA5AUy9YietNZzVNhku33aSzF1OZZsY";

var dropZone = document.getElementById('dropZone');
var fileInput = document.getElementById('fileInput');
var previewGrid = document.getElementById('previewGrid');
var previewCount = document.getElementById('previewCount');
var uploadBtn = document.getElementById('uploadBtn');
var statusBox = document.getElementById('statusBox');
var statusText = document.getElementById('statusText');
var spinner = document.getElementById('spinner');
var progressWrap = document.getElementById('progressWrap');
var progressBar = document.getElementById('progressBar');
var progressText = document.getElementById('progressText');
var customerName = document.getElementById('customerName');
var clearBtn = document.getElementById('clearBtn');

var selectedFiles = [];

function getUploadedFiles() {
  return JSON.parse(localStorage.getItem('uploadedFiles') || '[]');
}
function isDuplicate(file) {
  return getUploadedFiles().indexOf(file.name + '_' + file.size) >= 0;
}
function markUploaded(file) {
  var uploaded = getUploadedFiles();
  var key = file.name + '_' + file.size;
  if (uploaded.indexOf(key) < 0) {
    uploaded.push(key);
    localStorage.setItem('uploadedFiles', JSON.stringify(uploaded));
  }
}

dropZone.addEventListener('click', function() { fileInput.click(); });
dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('drag-over'); });
dropZone.addEventListener('drop', function(e) {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  addFiles(Array.from(e.dataTransfer.files).filter(function(f) { return f.type.startsWith('image/'); }));
});
fileInput.addEventListener('change', function(e) {
  addFiles(Array.from(e.target.files));
  fileInput.value = '';
});

function addFiles(files) {
  var dupNames = [];
  files.forEach(function(file) {
    if (isDuplicate(file)) {
      dupNames.push(file.name);
      return;
    }
    if (!selectedFiles.find(function(f) { return f.name === file.name && f.size === file.size; })) {
      selectedFiles.push(file);
    }
  });
  if (dupNames.length > 0) {
    showStatus('warning', '⚠ ' + dupNames.length + ' 张照片已上传过，无法重复上传', false);
  } else {
    hideStatus();
  }
  renderPreviews();
  checkReady();
}

function renderPreviews() {
  previewGrid.innerHTML = '';
  if (selectedFiles.length === 0) {
    previewCount.style.display = 'none';
    return;
  }
  previewCount.style.display = 'block';
  previewCount.textContent = '已选择 ' + selectedFiles.length + ' 张照片';
  selectedFiles.forEach(function(file, idx) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var item = document.createElement('div');
      item.className = 'preview-item';
      var img = document.createElement('img');
      img.src = e.target.result;
      img.alt = '预览';
      var btn = document.createElement('button');
      btn.className = 'remove';
      btn.textContent = '✕';
      btn.onclick = function() { removeFile(idx); };
      item.appendChild(img);
      item.appendChild(btn);
      previewGrid.appendChild(item);
    };
    reader.readAsDataURL(file);
  });
}

function removeFile(idx) {
  selectedFiles.splice(idx, 1);
  renderPreviews();
  checkReady();
}

customerName.addEventListener('input', checkReady);

function checkReady() {
  uploadBtn.disabled = !(selectedFiles.length > 0 && customerName.value.trim());
}

function showStatus(type, msg, showProg) {
  statusBox.className = 'status-box ' + type;
  statusText.textContent = msg;
  spinner.style.display = type === 'loading' ? 'block' : 'none';
  progressWrap.style.display = showProg ? 'block' : 'none';
}
function hideStatus() { statusBox.className = 'status-box'; }

function toBase64(file) {
  return new Promise(function(res, rej) {
    var r = new FileReader();
    r.onload = function() { res(r.result); };
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function saveHistory(name, count) {
  var records = JSON.parse(localStorage.getItem('uploadHistory') || '[]');
  var now = new Date();
  var dateStr = now.getFullYear() + '/' +
    String(now.getMonth()+1).padStart(2,'0') + '/' +
    String(now.getDate()).padStart(2,'0') + ' ' +
    String(now.getHours()).padStart(2,'0') + ':' +
    String(now.getMinutes()).padStart(2,'0');
  records.unshift({ name: name, count: count, date: dateStr });
  if (records.length > 50) records.pop();
  localStorage.setItem('uploadHistory', JSON.stringify(records));
  renderHistory();
}

function renderHistory() {
  var records = JSON.parse(localStorage.getItem('uploadHistory') || '[]');
  var list = document.getElementById('historyList');
  if (records.length === 0) {
    list.innerHTML = '<p class="history-empty">暂无上传记录</p>';
    return;
  }
  list.innerHTML = records.map(function(r) {
    return '<div class="h-record">' +
      '<div class="h-icon">🧾</div>' +
      '<div class="h-info">' +
        '<div class="h-name">' + r.name + '</div>' +
        '<div class="h-date">' + r.date + '</div>' +
      '</div>' +
      '<span class="h-count">' + r.count + ' 张</span>' +
    '</div>';
  }).join('');
}

clearBtn.addEventListener('click', function() {
  if (confirm('确认清空所有上传记录？')) {
    localStorage.removeItem('uploadHistory');
    localStorage.removeItem('uploadedFiles');
    renderHistory();
  }
});

uploadBtn.addEventListener('click', async function() {
  if (selectedFiles.length === 0 || !customerName.value.trim()) return;
  uploadBtn.disabled = true;
  var total = selectedFiles.length;
  var done = 0;
  var failed = 0;

  showStatus('loading', '正在上传... (0 / ' + total + ')', true);
  progressBar.style.width = '0%';
  progressText.textContent = '0 / ' + total;

  for (var i = 0; i < selectedFiles.length; i++) {
    var file = selectedFiles[i];
    try {
      var base64 = await toBase64(file);
      var base64Data = base64.split(',')[1];
      var timestamp = new Date().toISOString().replace(/[:.]/g, '-');
      var ext = file.name.split('.').pop();
      var fileName = customerName.value.trim() + '_' + timestamp + '.' + ext;
      var res = await fetch(POWER_AUTOMATE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ wechatName: customerName.value.trim(), '파일명': fileName, fileContent: base64Data })
      });
      if (!res.ok) throw new Error('error');
      markUploaded(file);
      done++;
    } catch(e) {
      failed++;
    }
    var pct = Math.round(((done + failed) / total) * 100);
    progressBar.style.width = pct + '%';
    progressText.textContent = (done + failed) + ' / ' + total;
    statusText.textContent = '正在上传... (' + (done + failed) + ' / ' + total + ')';
  }

  if (failed === 0) {
    showStatus('success', '✓ 上传成功！' + done + ' 张照片已保存', false);
    saveHistory(customerName.value.trim(), done);
    customerName.value = '';
    selectedFiles = [];
    renderPreviews();
  } else {
    showStatus('error', done + ' 张成功，' + failed + ' 张失败', false);
  }
  checkReady();
});

renderHistory();
</script>
</body>
</html>
