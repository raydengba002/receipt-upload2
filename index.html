<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영수증 업로드</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'Malgun Gothic', sans-serif; background: #f5f5f5; min-height: 100vh; }

    .header {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      padding: 1rem 2rem;
      display: flex; align-items: center; gap: 12px;
    }
    .header-logo {
      width: 36px; height: 36px; border-radius: 8px;
      background: #e8f0fe;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .header h1 { font-size: 16px; font-weight: 600; color: #111; }
    .header p { font-size: 13px; color: #666; }

    .container { max-width: 520px; margin: 2rem auto; padding: 0 1rem; }

    .card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    .section-title {
      font-size: 12px; font-weight: 600;
      color: #888;
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 1rem;
    }

    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 14px; color: #555; margin-bottom: 6px; }
    .field input[type="text"] {
      width: 100%; padding: 10px 12px;
      border: 1px solid #ddd; border-radius: 8px;
      font-size: 14px; color: #111;
      outline: none; transition: border-color 0.15s;
    }
    .field input[type="text"]:focus { border-color: #4285f4; }

    .drop-zone {
      border: 2px dashed #ddd;
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      background: #fafafa;
      margin-bottom: 1rem;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: #4285f4;
      background: #f0f4ff;
    }
    .drop-zone .icon { font-size: 36px; display: block; margin-bottom: 8px; }
    .drop-zone p { font-size: 14px; color: #555; margin-bottom: 4px; }
    .drop-zone span { font-size: 12px; color: #999; }

    .preview-wrap {
      position: relative; display: none;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 1rem;
      border: 1px solid #e5e5e5;
    }
    .preview-wrap img { width: 100%; max-height: 300px; object-fit: contain; display: block; }
    .preview-remove {
      position: absolute; top: 8px; right: 8px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 50%; width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px; color: #555;
    }

    .btn-upload {
      width: 100%; padding: 13px;
      background: #111;
      color: #fff;
      border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-upload:hover { opacity: 0.85; }
    .btn-upload:disabled { opacity: 0.35; cursor: not-allowed; }

    .status-box {
      display: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      align-items: center; gap: 10px;
      margin-top: 1rem;
    }
    .status-box.loading { display: flex; background: #f5f5f5; color: #555; border: 1px solid #e0e0e0; }
    .status-box.success { display: flex; background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .status-box.error { display: flex; background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }

    .spinner {
      width: 16px; height: 16px; flex-shrink: 0;
      border: 2px solid #ccc; border-top-color: #555;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="header">
  <div class="header-logo">🧾</div>
  <div>
    <h1>영수증 업로드</h1>
    <p>사진을 업로드하면 OneDrive에 자동 저장됩니다</p>
  </div>
</div>

<div class="container">
  <div class="card">
    <p class="section-title">고객 정보</p>
    <div class="field">
      <label>이름 (위챗명)</label>
      <input type="text" id="customerName" placeholder="이름을 입력하세요" />
    </div>
  </div>

  <div class="card">
    <p class="section-title">영수증 사진</p>

    <div class="drop-zone" id="dropZone">
      <span class="icon">📤</span>
      <p>사진을 여기에 끌어다 놓거나 클릭하여 선택</p>
      <span>JPG, PNG, HEIC 지원</span>
      <input type="file" id="fileInput" accept="image/*" style="display:none" />
    </div>

    <div class="preview-wrap" id="previewWrap">
      <img id="previewImg" src="" alt="영수증 미리보기" />
      <div class="preview-remove" id="removeBtn">✕</div>
    </div>

    <button class="btn-upload" id="uploadBtn" disabled>
      ☁️ OneDrive에 업로드
    </button>

    <div class="status-box" id="statusBox">
      <div class="spinner" id="spinner"></div>
      <span id="statusText">업로드 중...</span>
    </div>
  </div>
</div>

<script>
  // ✅ 여기에 Power Automate URL을 붙여넣으세요
  const POWER_AUTOMATE_URL = "https://default4dc4b497ff1f4fff857bfa0d86f15a.72.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/cf97a6044d424595b762b220cd87a7e7/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=yioV9Os8w__fkA5AUy9YietNZzVNhku33aSzF1OZZsY";

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const previewWrap = document.getElementById('previewWrap');
  const previewImg = document.getElementById('previewImg');
  const removeBtn = document.getElementById('removeBtn');
  const uploadBtn = document.getElementById('uploadBtn');
  const statusBox = document.getElementById('statusBox');
  const statusText = document.getElementById('statusText');
  const spinner = document.getElementById('spinner');
  const customerName = document.getElementById('customerName');

  let selectedFile = null;

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) loadFile(file);
  });
  fileInput.addEventListener('change', e => {
    if (e.target.files[0]) loadFile(e.target.files[0]);
  });

  function loadFile(file) {
    selectedFile = file;
    const reader = new FileReader();
    reader.onload = e => {
      previewImg.src = e.target.result;
      previewWrap.style.display = 'block';
      dropZone.style.display = 'none';
      checkReady();
    };
    reader.readAsDataURL(file);
  }

  removeBtn.addEventListener('click', () => {
    selectedFile = null;
    previewWrap.style.display = 'none';
    dropZone.style.display = 'block';
    fileInput.value = '';
    checkReady();
    hideStatus();
  });

  customerName.addEventListener('input', checkReady);

  function checkReady() {
    uploadBtn.disabled = !(selectedFile && customerName.value.trim());
  }

  function showStatus(type, msg) {
    statusBox.className = 'status-box ' + type;
    statusText.textContent = msg;
    spinner.style.display = type === 'loading' ? 'block' : 'none';
  }
  function hideStatus() { statusBox.className = 'status-box'; }

  uploadBtn.addEventListener('click', async () => {
    if (!selectedFile || !customerName.value.trim()) return;
    uploadBtn.disabled = true;
    showStatus('loading', '업로드 중...');

    try {
      const base64 = await toBase64(selectedFile);
      const base64Data = base64.split(',')[1];
      const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
      const ext = selectedFile.name.split('.').pop();
      const fileName = customerName.value.trim() + '_' + timestamp + '.' + ext;

      const res = await fetch(POWER_AUTOMATE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          wechatName: customerName.value.trim(),
          파일명: fileName,
          fileContent: base64Data
        })
      });

      if (res.ok) {
        showStatus('success', '✓ 업로드 완료! OneDrive에 저장되었습니다.');
        customerName.value = '';
        selectedFile = null;
        previewWrap.style.display = 'none';
        dropZone.style.display = 'block';
        fileInput.value = '';
      } else {
        throw new Error('서버 오류: ' + res.status);
      }
    } catch (err) {
      showStatus('error', '업로드 실패: ' + err.message);
      uploadBtn.disabled = false;
    }
    checkReady();
  });

  function toBase64(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }
</script>
</body>
</html>
